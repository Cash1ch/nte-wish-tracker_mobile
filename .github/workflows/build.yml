name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ github.run_id }}
          restore-keys: buildozer-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Download Tesseract4Android AAR
        run: |
          mkdir -p libs
          curl -fL --retry 8 --retry-delay 20 --retry-all-errors \
            -o libs/tesseract4android-4.9.0.aar \
            https://jitpack.io/cz/adaptech/tesseract4android/tesseract4android/4.9.0/tesseract4android-4.9.0.aar
          ls -l libs

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        run: grep -n -B3 -A30 -E "What went wrong|FAILURE:|Could not resolve|Execution failed|error:" build.log | head -200

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }

      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: apk, path: bin/*.apk }
