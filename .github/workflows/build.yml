name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          sudo apt-get install -y libtinfo5 || true

      - name: Install Buildozer
        run: pip install buildozer "cython==0.29.36" setuptools

      - name: Build APK
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          yes | buildozer -v android debug > build.log 2>&1

      - name: Show Gradle error (on failure)
        if: failure()
        run: |
          echo "=== GRADLE ERROR ==="
          awk '/FAILURE: Build failed/{f=1} f{print; n++} n>45{exit}' build.log
          echo "=== LAST 15 LINES ==="
          tail -n 15 build.log | cut -c1-300

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortune-wheel-apk
          path: bin/*.apk
          if-no-files-found: error
