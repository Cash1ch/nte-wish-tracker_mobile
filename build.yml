name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ github.run_id }}
          restore-keys: buildozer-v2-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Download and unpack Tesseract4Android
        run: |
          mkdir -p libs/arm64-v8a /tmp/t4a
          curl -fL --retry 8 --retry-delay 20 --retry-all-errors \
            -o /tmp/t4a/t4a.aar \
            https://jitpack.io/cz/adaptech/tesseract4android/tesseract4android/4.9.0/tesseract4android-4.9.0.aar
          unzip -o -q /tmp/t4a/t4a.aar -d /tmp/t4a/x
          find /tmp/t4a/x -type f | sort
          cp /tmp/t4a/x/classes.jar libs/tesseract4android.jar
          cp /tmp/t4a/x/jni/arm64-v8a/*.so libs/arm64-v8a/
          ls -l libs libs/arm64-v8a

      - name: Drop stale dist from cache
        run: rm -rf .buildozer/android/platform/build-arm64-v8a/dists

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Save build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ github.run_id }}

      - name: Check APK for Tesseract classes
        if: always()
        run: |
          ls -l bin/*.apk || true
          for f in bin/*.apk; do unzip -p "$f" 'classes*.dex' | strings | grep -c "TessBaseAPI" || true; done
          unzip -l bin/*.apk | grep -E "libtesseract|libleptonica|libjpeg|libpng" || true

      - name: Show the real error
        if: failure()
        run: grep -n -B3 -A30 -E "What went wrong|FAILURE:|Could not resolve|Execution failed|error:|Error 1" build.log | head -200

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }

      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: apk, path: bin/*.apk }
